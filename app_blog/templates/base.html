{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Облік основних засобів{% endblock %}</title>
    <!-- Підключаємо Bootstrap та власні стилі -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <!-- Навігаційна панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Облік ОЗ (Варіант 9)</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Надходження</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Переміщення</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Вибуття</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Амортизація</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основний контент сторінок -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
